source_reliability:
  value: 0.9
  rationale: National regulator and authoritative for charity registration, names and ABNs. Addresses, websites
    and size flags are charity self-reported and can be stale or sloppy. Withheld records are absent by design.
notes:
- 'Licence: Creative Commons Attribution 3.0 Australia. Attribution to ACNC is required; carry it in the envelope.'
- Parse as UTF-8 CSV with quoting honoured. Other_Organisation_Names contains Arabic text and embedded commas. Read
  every column as string so ABN and postcode leading zeros survive.
- Dates are day-first dd/mm/yyyy (%d/%m/%Y) if a reviewer later maps Registration_Date or Date_Organisation_Established.
  Financial_Year_End is a day-month value, not a date.
- About 1.6% of rows have no ABN, and about 12% have no address. These emit fewer observations; the abn transform
  drops values that fail the checksum, but all sampled ABNs were valid.
- entity_type_from_name is a suffix heuristic on the legal name. Many charities (churches, community groups, Aboriginal
  Corporations, trusts) will come out as unknown. That is intended.
- 'Country map (round 2 revision): v1 and v2 both failed on 100% of values with "value not in map", even for ''Australia''
  after upper-casing. The likely cause is that the map arguments were nested under an "args" key instead of sitting
  beside "op". They are now top-level. Countries not in the map are dropped, not defaulted to AU. The map is a finite
  list, so a small share of overseas countries may be dropped. A reviewer should confirm the engine does not apply
  the ontology default AU to dropped values, since that would mislabel overseas addresses.'
- Some legal names look anonymised or withheld (e.g. '847219-X8N0N9- PAF', with no ABN or address). They are passed
  through as the source states them; consider a downstream filter.
- Address_Line_1 sometimes holds a C/O or organisation name (e.g. a school P&C), so address.full may not be a clean
  street address for those rows.
- 'Charity_Website sometimes holds social media pages or a parent organisation''s site rather than the charity''s
  own site (seen in the held-out preview: a subsidiary listing its parent''s site).'
- The dataset description was truncated, so a caveat about future withdrawal of information may be missing. The
  file is a weekly snapshot, so the last-modified date is a coarse proxy for observed_at.
- '5000-row profile only: ABN uniqueness across the full file is not verified (4918 distinct over ~4920 non-empty).
  Held-out 500 records had no duplicate record ids.'
