record_id:
  strategy: fields
  fields:
  - ABN
  - Charity_Legal_Name
  rationale: 'ABN is the register key (every non-empty value passes the checksum and the top values are all unique),
    but 1.6% of rows have no ABN and ~2 non-empty ABNs may repeat across 5000 rows. Adding the legal name keeps
    blank-ABN rows distinct and separates any duplicate ABNs. The cost is that the id changes if a charity renames
    itself between weekly snapshots. Held-out check: 0 duplicate ids in 500 records.'
mappings:
- canonical: entity.abn
  source: ABN
  transforms:
  - op: strip
  - op: abn
  confidence: 0.97
  rationale: 11-digit values, 100% pass the real ABN checksum; the header and description identify it as the charity's
    ABN.
- canonical: entity.legal_name
  source: Charity_Legal_Name
  transforms:
  - op: strip
  - op: collapse_ws
  confidence: 0.92
  rationale: Registered charity name as held on the ACNC register; 72% carry company suffixes (Ltd, Inc, Pty Ltd).
    Case is left as the source gives it.
- canonical: entity.entity_type
  source: Charity_Legal_Name
  transforms:
  - op: entity_type_from_name
  confidence: 0.7
  rationale: No entity type column. Derived only from unambiguous legal suffixes in the registered name (Pty Ltd
    / Limited / Inc); everything else stays unknown. Trusts, Aboriginal Corporations, 'Community Garden' style names
    etc. are deliberately not guessed.
- canonical: entity.website
  source: Charity_Website
  transforms:
  - op: strip
  - op: url
  confidence: 0.65
  rationale: Self-reported website; 88% of non-empty values are URL-like. Some are social media pages, and some
    point to a parent or related organisation's site rather than the charity's own (e.g. BHL Dalyellup Two Apartments
    Ltd lists bethanie.com.au).
- canonical: address.full
  source:
  - Address_Line_1
  - Address_Line_2
  - Address_Line_3
  - Town_City
  - State
  - Postcode
  transforms:
  - op: collapse_ws
  - op: strip
  confidence: 0.75
  rationale: Concatenation of the structured address parts. Address_Line_1 sometimes holds a C/O or organisation
    name rather than a street, and Line_3 has stray values like 'via' or 'Australia', so the full string is only
    moderately reliable.
- canonical: address.locality
  source: Town_City
  transforms:
  - op: strip
  - op: collapse_ws
  confidence: 0.9
  rationale: Suburb or town values (Sydney, Carlton North, Wyoming).
- canonical: address.state
  source: State
  transforms:
  - op: strip
  - op: state
  confidence: 0.92
  rationale: '100% of non-empty values are state-like abbreviations (NSW, VIC, QLD...). Held-out: 434/434 parsed.'
- canonical: address.postcode
  source: Postcode
  transforms:
  - op: strip
  - op: postcode
  confidence: 0.9
  rationale: Postcode-like values; read as string; the postcode transform restores a dropped leading zero. A rare
    invalid value (e.g. 6 digits) is dropped (1/435 on held-out).
- canonical: address.country
  source: Country
  transforms:
  - op: strip
  - op: collapse_ws
  - op: upper
  - op: map_values
    map:
      AUSTRALIA: AU
      AUS: AU
      AU: AU
      AUSTRIA: AT
      ARUBA: AW
      SINGAPORE: SG
      NEW ZEALAND: NZ
      UNITED KINGDOM: GB
      UNITED STATES: US
      UNITED STATES OF AMERICA: US
      INDIA: IN
      CANADA: CA
      CHINA: CN
      HONG KONG: HK
      JAPAN: JP
      MALAYSIA: MY
      INDONESIA: ID
      PHILIPPINES: PH
      SOUTH AFRICA: ZA
      KENYA: KE
      GERMANY: DE
      FRANCE: FR
      IRELAND: IE
      PAPUA NEW GUINEA: PG
      FIJI: FJ
      THAILAND: TH
      VIETNAM: VN
      SWITZERLAND: CH
    case_insensitive: true
  confidence: 0.8
  rationale: Mostly 'Australia' / 'AUSTRALIA'. Other literal country names are mapped to ISO codes rather than defaulting
    to AU, which would be wrong for them. Unmapped values (e.g. the phone number '0419032014') are dropped, not
    defaulted.
unmapped_source_fields:
- source: Other_Organisation_Names
  reason: 'Mixed content: other/former names, abbreviations, ''Previously known as'' text and non-Latin translations.
    Commas occur inside single names (e.g. ''ATF ...''), so a comma split would corrupt them, and it is unclear
    that they are trading names. Mapping it to trading_name would risk wrong claims.'
- source: Address_Type
  reason: Constant 'Business' on all 5000 records; no canonical field and no information.
- source: Registration_Date
  reason: Date the charity registered with the ACNC. This is not the company or entity registration date (date_registered),
    and it is not when the name or address claims became true (valid_from applies to every emitted observation),
    so it is left unmapped to avoid a misleading mapping. Reviewer may override. Format is dd/mm/yyyy (%d/%m/%Y).
- source: Date_Organisation_Established
  reason: Establishment date of the organisation. Not clearly the registration date in the ontology sense, and it
    is often identical to Registration_Date. Format is dd/mm/yyyy.
- source: Charity_Size
  reason: ACNC size classification (Small/Medium/Large) based on revenue; no canonical field. Blank on 14%.
- source: Number_of_Responsible_Persons
