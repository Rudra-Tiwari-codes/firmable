unmapped_canonical_fields:
- canonical: entity.trading_name
  reason: Only candidate is Other_Organisation_Names, which mixes former names, abbreviations and free text and
    cannot be split safely.
- canonical: entity.acn
  reason: No ACN column. Deriving it from the ABN would give wrong values for the many non-company charities (incorporated
    associations, trusts, etc.), where the last 9 digits are not an ACN.
- canonical: entity.nzbn
  reason: Not present; Australian source.
- canonical: entity.status
  reason: No status column. The register lists currently registered charities, but that is not stated per record,
    so status is left as unknown rather than inferred as active.
- canonical: entity.industry_code
  reason: No ANZSIC or industry column; the purpose flags are not an industry classification.
- canonical: entity.date_registered
  reason: Registration_Date is ACNC registration, not entity registration; left unmapped (see unmapped_source_fields).
- canonical: observation.observed_at
  reason: No per-record statement date; the engine will use the resource's last-modified date.
- canonical: observation.valid_from
  reason: No column giving when the emitted name/address claims became true.
- canonical: observation.valid_to
  reason: No end date column; deregistered or revoked charities are not represented.
